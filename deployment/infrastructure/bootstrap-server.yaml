# ABOUTME: CloudFormation template for the Claude Desktop Bootstrap Server (credential broker)
# ABOUTME: Deploys an Application Load Balancer (internal or internet-facing) + Lambda that
# ABOUTME: brokers a per-user Bedrock bearer token via AssumeRoleWithWebIdentity and returns
# ABOUTME: per-user config at sign-in. No end-user binary; pure MDM trust anchor on devices.

# WHY AN ALB AND NOT API GATEWAY
#   An API Gateway HTTP API cannot be made private ("you can only configure REST
#   APIs as private") and supports neither resource policies nor AWS WAF. With
#   AlbScheme=internal the ALB has only private IPs, so the endpoint is reachable
#   exclusively from inside the VPC or over the customer's own VPN / Direct
#   Connect. This template provisions NO connectivity (no VPN, Direct Connect,
#   Transit Gateway or peering) and NO hosted zone or certificate: the VPC,
#   subnets, certificate and DNS are all customer-supplied inputs.
#
# WHERE TOKEN VALIDATION WENT
#   There is no API Gateway JWT authorizer any more — an ALB cannot validate JWTs,
#   and its authenticate-oidc action is a browser-redirect flow, which is the
#   wrong shape for a bearer-token API call. The authoritative validator is STS:
#   AssumeRoleWithWebIdentity verifies the token's signature against the IdP's
#   JWKS plus iss/aud/exp before any credential is issued. The Lambda also runs a
#   cheap signature-free pre-check on iss/aud/exp purely to fail fast. See the
#   Lambda module docstring for the full argument.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Claude Desktop Bootstrap Server (credential broker) — delivers per-user
  configuration dynamically at sign-in as an alternative to static MDM profiles.
  Exchanges the user's OIDC token for STS credentials (session tags intact), mints
  a short-term Amazon Bedrock bearer token scoped to the user's zone, and returns
  it with region, models, feature toggles and OTEL settings. Fronted by an
  Application Load Balancer that can be internal (private) or internet-facing.

Parameters:
  OidcIssuerUrl:
    Type: String
    Description: "OIDC issuer URL (e.g. https://company.okta.com/oauth2/default)"
    AllowedPattern: "^https://.*"
    ConstraintDescription: "Must be a valid HTTPS URL"

  OidcAudience:
    Type: String
    Description: >
      Audience expected on the ACCESS token Claude Desktop sends. For an Okta
      custom authorization server this is the server's audience (e.g.
      api://default), NOT the client ID. For providers whose access-token
      audience is the client ID, set this to the client ID.
      (The client ID itself is only needed client-side, in the MDM bootstrapOidc.)
      Used by the Lambda's fail-fast pre-check; STS re-validates it against the
      IAM OIDC provider's ClientIdList, which is the real enforcement point.
    MinLength: 1

  DefaultInferenceRegion:
    Type: String
    Description: "Default AWS region for Bedrock inference"
    Default: "us-east-1"

  DefaultInferenceModels:
    Type: String
    Description: "Comma-separated list of allowed model IDs"
    Default: "us.anthropic.claude-sonnet-4-20250514-v1:0"

  OtlpEndpoint:
    Type: String
    Description: "OpenTelemetry collector endpoint URL (optional)"
    Default: ""

  InferenceSessionLifetimeSec:
    Type: Number
    Description: "Session lifetime in seconds before re-authentication reminder"
    Default: 28800
    MinValue: 3600
    MaxValue: 86400

  DiscoveryRegions:
    Type: String
    Description: "Comma-separated regions to scan for zone-tagged application inference profiles (the profile's allowed_bedrock_regions)."
    Default: ""

  ZoneTagKey:
    Type: String
    Description: "The resource-tag key that identifies a profile's zone. Matches the GDPR isolation Zone tag."
    Default: "Zone"

  CostTagKey:
    Type: String
    Description: "The principal-tag key carrying cost attribution (e.g. Project or CostCenter). Shown in the Desktop header banner; matches the profile's cost_attribution_tag_key."
    Default: "Project"

  CostLabel:
    Type: String
    Description: "Human-readable label shown before the cost value in the Desktop header banner. Decoupled from CostTagKey so the value can come from a 'Project' tag while the banner reads 'Cost Center'."
    Default: "Cost Center"

  RoleConfig:
    Type: String
    Description: "JSON mapping of role names to model/MCP config (e.g. {\"consulting\":{\"models\":[\"claude-opus-4-6-v1:0\"],\"max_tokens_per_window\":\"5000000\"}})"
    Default: ""

  FeatureDefaults:
    Type: String
    Description: "JSON of default feature toggles (e.g. {\"chatTabEnabled\":\"true\",\"coworkTabEnabled\":\"true\"})"
    Default: ""

  GroupPrefix:
    Type: String
    Description: "Okta group name prefix for zone/role matching"
    Default: "ccwb-"

  FederatedRoleArn:
    Type: String
    Description: >
      ARN of the existing OIDC-federated IAM role the broker assumes on behalf
      of each user (same role Claude Code uses for direct STS federation). Its
      trust policy already permits sts:AssumeRoleWithWebIdentity + sts:TagSession
      for the org OIDC provider and client-id audience.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$"
    ConstraintDescription: "Must be a valid IAM role ARN"

  MaxSessionDuration:
    Type: Number
    Description: "STS session / Bedrock bearer-token lifetime in seconds (matches the role's max session duration)"
    Default: 43200
    MinValue: 900
    MaxValue: 43200

  # ---------------------------------------------------------------------------
  # Endpoint (ALB) — customer-supplied networking. Nothing here creates
  # connectivity; reaching an internal ALB is the customer's responsibility
  # (VPN / Direct Connect / in-VPC clients).
  # ---------------------------------------------------------------------------
  AlbScheme:
    Type: String
    Description: >
      internal = private endpoint, only reachable from within the VPC or over the
      customer's own VPN/Direct Connect (recommended). internet-facing = public
      ALB; if you choose this, front it with AWS WAF.
    Default: internal
    AllowedValues:
      - internal
      - internet-facing

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC to place the load balancer in"

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two subnets in DIFFERENT Availability Zones for the load balancer.
      For AlbScheme=internal use private subnets. No NAT is required: the ALB
      needs no outbound access and the Lambda is invoked through the Lambda API
      rather than from inside the subnet.

  CertificateArn:
    Type: String
    Description: >
      ACM certificate ARN for the HTTPS listener, in THIS region. Leave EMPTY to
      have the stack request one for DomainName, DNS-validated via
      CertificateValidationZoneId (or HostedZoneId). Supply your own when you use
      ACM Private CA, an imported certificate, or a domain outside Route 53. The
      certificate's domain must match the hostname clients connect to, otherwise
      TLS verification fails.
    Default: ""

  CertificateValidationZoneId:
    Type: String
    Description: >
      Optional. PUBLIC Route 53 hosted zone used only to publish the ACM DNS
      validation record. Needed when HostedZoneId is a PRIVATE zone: ACM's
      validators query public DNS, so a private zone cannot prove domain control.
      Defaults to HostedZoneId, which is correct when that zone is public.
      Ignored when CertificateArn is supplied.
    Default: ""

  AlbIngressCidr:
    Type: String
    Description: >
      CIDR allowed to reach the listener on 443 — normally the VPC CIDR. Use
      0.0.0.0/0 only with AlbScheme=internet-facing.
    Default: "10.0.0.0/8"
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    ConstraintDescription: "Must be a valid IPv4 CIDR block"

  AlbAdditionalIngressCidr:
    Type: String
    Description: >
      Optional second CIDR allowed on 443 — typically the VPN client CIDR, which
      is outside the VPC range. Leave empty if not needed.
    Default: ""

  DomainName:
    Type: String
    Description: >
      Optional. Hostname clients use (must be covered by CertificateArn). Set this
      together with HostedZoneId to have the stack create the alias record. Leave
      both empty if your DNS is managed outside Route 53 — then point a CNAME at
      the AlbDnsName output yourself.
    Default: ""

  HostedZoneId:
    Type: String
    Description: >
      Optional. Route 53 hosted zone ID for DomainName. Works with either a PRIVATE
      zone (recommended for AlbScheme=internal) or a public zone. A public zone
      pointing at an internal ALB publishes your private IPs — valid, but some
      security teams object.
    Default: ""

Conditions:
  # Only create the DNS record when we have both halves; otherwise the admin
  # wires DNS up themselves from the AlbDnsName output.
  HasDns: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

  # A domain name was supplied at all. Drives the published BootstrapUrl. This is
  # DELIBERATELY separate from HasDns: a customer whose DNS lives OUTSIDE Route 53
  # (e.g. corporate Infoblox/BIND) supplies DomainName but no HostedZoneId — they
  # point their own CNAME at the AlbDnsName output. The MDM URL must still use their
  # hostname (the one the certificate covers); the raw ALB name would fail TLS.
  HasDomainName: !Not [!Equals [!Ref DomainName, ""]]

  HasAdditionalIngressCidr: !Not [!Equals [!Ref AlbAdditionalIngressCidr, ""]]

  # Request a certificate only when the admin didn't supply one. Requires a domain
  # to request it FOR and a zone to publish the validation record IN — without both
  # the stack would hang waiting for a validation that can never succeed.
  CreateCertificate: !And
    - !Equals [!Ref CertificateArn, ""]
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Or
      - !Not [!Equals [!Ref CertificateValidationZoneId, ""]]
      - !Not [!Equals [!Ref HostedZoneId, ""]]

  UseSeparateValidationZone: !Not [!Equals [!Ref CertificateValidationZoneId, ""]]

Resources:
  BootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-bootstrap"
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 10
      MemorySize: 256
      # Relative dir uploaded to S3 by `aws cloudformation package` at deploy time
      # (the real handler is ~18KB, over the 4KB inline ZipFile limit).
      Code: ./lambda-functions/bootstrap_server/
      Environment:
        Variables:
          # An ALB cannot validate JWTs, so the function does a cheap
          # signature-free pre-check on iss/aud/exp to fail fast. The
          # authoritative validation is STS AssumeRoleWithWebIdentity.
          OIDC_ISSUER: !Ref OidcIssuerUrl
          OIDC_AUDIENCE: !Ref OidcAudience
          DEFAULT_INFERENCE_REGION: !Ref DefaultInferenceRegion
          DEFAULT_INFERENCE_MODELS: !Ref DefaultInferenceModels
          OTLP_ENDPOINT: !Ref OtlpEndpoint
          INFERENCE_SESSION_LIFETIME_SEC: !Ref InferenceSessionLifetimeSec
          DISCOVERY_REGIONS: !Ref DiscoveryRegions
          ZONE_TAG_KEY: !Ref ZoneTagKey
          COST_TAG_KEY: !Ref CostTagKey
          COST_LABEL: !Ref CostLabel
          ROLE_CONFIG: !Ref RoleConfig
          FEATURE_DEFAULTS: !Ref FeatureDefaults
          GROUP_PREFIX: !Ref GroupPrefix
          FEDERATED_ROLE_ARN: !Ref FederatedRoleArn
          MAX_SESSION_DURATION: !Ref MaxSessionDuration
      Role: !GetAtt BootstrapFunctionRole.Arn
      Tags:
        - Key: Application
          Value: "claude-code-with-bedrock"
        - Key: Component
          Value: "bootstrap-server"

  # Least privilege by design. The broker calls STS AssumeRoleWithWebIdentity
  # UNSIGNED (with the user's OIDC token), which is authorized by the target
  # role's trust policy — NOT by this execution role. Do NOT add sts:AssumeRole
  # or bedrock:* grants here; they are unnecessary and would broaden the blast
  # radius. CloudWatch Logs is the only permission required.
  BootstrapFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-bootstrap-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

  # ---------------------------------------------------------------------------
  # Endpoint: Application Load Balancer -> Lambda target.
  #
  # Chosen over API Gateway because an HTTP API cannot be made private
  # ("you can only configure REST APIs as private") and supports neither
  # resource policies nor AWS WAF. With AlbScheme=internal the endpoint has only
  # private IPs, so it is reachable exclusively from inside the VPC or over the
  # customer's own VPN / Direct Connect.
  # ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} bootstrap ALB - HTTPS from approved CIDRs"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AlbIngressCidr
          Description: "HTTPS from approved CIDR"
        - !If
          - HasAdditionalIngressCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref AlbAdditionalIngressCidr
            Description: "HTTPS from additional approved CIDR (e.g. VPN clients)"
          - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: "claude-code-with-bedrock"
        - Key: Component
          Value: "bootstrap-server"
        - Key: Name
          Value: !Sub "${AWS::StackName}-bootstrap-alb-sg"

  BootstrapAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # No explicit Name: an ALB name is capped at 32 chars, and
    # "${AWS::StackName}-bs-alb" overflows for a normal-length stack name
    # (e.g. claude-code-auth-bootstrap-bs-alb = 33 -> deploy fails). Let
    # CloudFormation auto-generate a conformant name; a Name TAG keeps it readable.
    Properties:
      Type: application
      Scheme: !Ref AlbScheme
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-bs-alb"
        - Key: Application
          Value: "claude-code-with-bedrock"
        - Key: Component
          Value: "bootstrap-server"

  # Must exist before the target group registers the function.
  BootstrapAlbPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BootstrapFunction
      Action: "lambda:InvokeFunction"
      Principal: elasticloadbalancing.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*"

  BootstrapTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: BootstrapAlbPermission
    # No explicit Name: a target-group name is also capped at 32 chars, and
    # "${AWS::StackName}-bs-tg" sits right at the edge (33 for a slightly longer
    # stack name). Auto-generate it; a Name TAG keeps it readable.
    Properties:
      TargetType: lambda
      Targets:
        - Id: !GetAtt BootstrapFunction.Arn
      # MUST stay false. A health check would invoke the function with a
      # synthetic request carrying no bearer token, get a 401, and mark the
      # only target unhealthy -> the listener would return 503 to every client.
      HealthCheckEnabled: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-bs-tg"
        - Key: Application
          Value: "claude-code-with-bedrock"

  # Default action is a 404 so only the /config path reaches the function.
  # Only created when no CertificateArn was supplied. CloudFormation publishes the
  # DNS validation record itself and BLOCKS until ACM issues, so the zone must be
  # public and must actually host DomainName — otherwise the stack waits instead of
  # failing fast.
  BootstrapCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !If
            - UseSeparateValidationZone
            - !Ref CertificateValidationZoneId
            - !Ref HostedZoneId
      Tags:
        - Key: Application
          Value: "claude-code-with-bedrock"
        - Key: Component
          Value: "bootstrap-server"

  BootstrapHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BootstrapAlb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If
            - CreateCertificate
            - !Ref BootstrapCertificate
            - !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: "application/json"
            MessageBody: '{"error":"not_found"}'

  BootstrapConfigRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref BootstrapHttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/config"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BootstrapTargetGroup

  # Unauthenticated reachability probe. A user opens <url>/health in a browser; a
  # green page proves their desktop can reach the ALB. Same target group as /config
  # (the Lambda distinguishes by path and returns only the caller's own source IP,
  # echoed back from x-forwarded-for — no STS, no token, no config). Any path other
  # than /config and /health hits the listener's default 404 action.
  BootstrapHealthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref BootstrapHttpsListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/health"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BootstrapTargetGroup

  # Alias record. Behaves identically for a PRIVATE or a public hosted zone.
  BootstrapDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt BootstrapAlb.DNSName
        HostedZoneId: !GetAtt BootstrapAlb.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  BootstrapUrl:
    Description: >
      Bootstrap server endpoint URL for the MDM bootstrapUrl key. Uses DomainName
      whenever one is supplied — including when DNS is managed outside Route 53 and
      this stack creates no record — because clients must connect on the hostname the
      certificate covers. Only when NO DomainName is set does it fall back to the raw
      ALB name, which WILL fail TLS hostname verification: use that only for in-VPC
      smoke tests, and publish a real hostname before rollout.
    Value: !If
      - HasDomainName
      - !Sub "https://${DomainName}/config"
      - !Sub "https://${BootstrapAlb.DNSName}/config"
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapUrl"

  BootstrapUrlHealth:
    Description: >
      Unauthenticated reachability probe. Open this in a browser from a user desktop:
      a green "Connected" page proves the device can reach the endpoint. Needs no
      token or sign-in. Uses DomainName when set, else the raw ALB name.
    Value: !If
      - HasDomainName
      - !Sub "https://${DomainName}/health"
      - !Sub "https://${BootstrapAlb.DNSName}/health"

  BootstrapFunctionArn:
    Description: "Bootstrap Lambda function ARN"
    Value: !GetAtt BootstrapFunction.Arn

  AlbDnsName:
    Description: "ALB DNS name - point your own CNAME here if DNS is managed outside Route 53"
    Value: !GetAtt BootstrapAlb.DNSName

  AlbCanonicalHostedZoneId:
    Description: "ALB canonical hosted zone ID, for creating an alias record yourself"
    Value: !GetAtt BootstrapAlb.CanonicalHostedZoneID

  AlbScheme:
    Description: "Whether the endpoint is private (internal) or public (internet-facing)"
    Value: !Ref AlbScheme

  CertificateArnUsed:
    Description: "The certificate on the listener — created by this stack, or the one you supplied"
    Value: !If
      - CreateCertificate
      - !Ref BootstrapCertificate
      - !Ref CertificateArn
