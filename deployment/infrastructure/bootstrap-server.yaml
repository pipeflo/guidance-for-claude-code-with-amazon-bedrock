# ABOUTME: CloudFormation template for the Claude Desktop Bootstrap Server (credential broker)
# ABOUTME: Deploys a PRIVATE API Gateway REST API + Lambda that brokers a per-user Bedrock
# ABOUTME: bearer token via AssumeRoleWithWebIdentity and returns per-user config at sign-in.
# ABOUTME: No end-user binary; pure MDM trust anchor on devices.

# WHY A PRIVATE REST API
#   The endpoint must be reachable only over the customer's private network. Of the
#   options AWS offers, only a REST API can be PRIVATE ("you can only configure
#   REST APIs as private" — an HTTP API cannot, and neither supports it on the
#   client-facing side otherwise).
#
#   Crucially, a private REST API keeps AWS-MANAGED TLS on the execute-api
#   hostname, so this template needs NO ACM certificate, NO public hosted zone and
#   NO DNS record. That is why it replaced an internal Application Load Balancer:
#   an ALB HTTPS listener requires a certificate you supply, and AWS will not issue
#   one for *.elb.amazonaws.com.
#
#   Reachability is the customer's responsibility. This template provisions NO
#   connectivity — no VPN, Direct Connect, Transit Gateway or peering — and does
#   not create a VPC. A brand-new VPC would be pointless here: nothing could reach
#   the endpoint inside it.
#
# WHERE TOKEN VALIDATION WENT
#   There is no API Gateway JWT authorizer (REST APIs do not offer one). The
#   authoritative validator is STS: AssumeRoleWithWebIdentity verifies the token's
#   signature against the IdP's JWKS plus iss/aud/exp before any credential is
#   issued. The Lambda also runs a cheap signature-free pre-check on iss/aud/exp
#   purely to fail fast. See the Lambda module docstring for the full argument.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Claude Desktop Bootstrap Server (credential broker) — delivers per-user
  configuration dynamically at sign-in as an alternative to static MDM profiles.
  Exchanges the user's OIDC token for STS credentials (session tags intact), mints
  a short-term Amazon Bedrock bearer token scoped to the user's zone, and returns
  it with region, models, feature toggles and OTEL settings. Served from a PRIVATE
  API Gateway REST API reachable only through an execute-api VPC endpoint.

Parameters:
  OidcIssuerUrl:
    Type: String
    Description: "OIDC issuer URL (e.g. https://company.okta.com/oauth2/default)"
    AllowedPattern: "^https://.*"
    ConstraintDescription: "Must be a valid HTTPS URL"

  OidcAudience:
    Type: String
    Description: >
      Audience expected on the ACCESS token Claude Desktop sends. For an Okta
      custom authorization server this is the server's audience (e.g.
      api://default), NOT the client ID. For providers whose access-token
      audience is the client ID, set this to the client ID.
      (The client ID itself is only needed client-side, in the MDM bootstrapOidc.)
      Used by the Lambda's fail-fast pre-check; STS re-validates it against the
      IAM OIDC provider's ClientIdList, which is the real enforcement point.
    MinLength: 1

  DefaultInferenceRegion:
    Type: String
    Description: "Default AWS region for Bedrock inference"
    Default: "us-east-1"

  DefaultInferenceModels:
    Type: String
    Description: "Comma-separated list of allowed model IDs"
    Default: "us.anthropic.claude-sonnet-4-20250514-v1:0"

  OtlpEndpoint:
    Type: String
    Description: "OpenTelemetry collector endpoint URL (optional)"
    Default: ""

  InferenceSessionLifetimeSec:
    Type: Number
    Description: "Session lifetime in seconds before re-authentication reminder"
    Default: 28800
    MinValue: 3600
    MaxValue: 86400

  DiscoveryRegions:
    Type: String
    Description: "Comma-separated regions to scan for zone-tagged application inference profiles (the profile's allowed_bedrock_regions)."
    Default: ""

  ZoneTagKey:
    Type: String
    Description: "The resource-tag key that identifies a profile's zone. Matches the GDPR isolation Zone tag."
    Default: "Zone"

  RoleConfig:
    Type: String
    Description: "JSON mapping of role names to model/MCP config (e.g. {\"consulting\":{\"models\":[\"claude-opus-4-6-v1:0\"],\"max_tokens_per_window\":\"5000000\"}})"
    Default: ""

  FeatureDefaults:
    Type: String
    Description: "JSON of default feature toggles (e.g. {\"chatTabEnabled\":\"true\",\"coworkTabEnabled\":\"true\"})"
    Default: ""

  GroupPrefix:
    Type: String
    Description: "Okta group name prefix for zone/role matching"
    Default: "ccwb-"

  FederatedRoleArn:
    Type: String
    Description: >
      ARN of the existing OIDC-federated IAM role the broker assumes on behalf
      of each user (same role Claude Code uses for direct STS federation). Its
      trust policy already permits sts:AssumeRoleWithWebIdentity + sts:TagSession
      for the org OIDC provider and client-id audience.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$"
    ConstraintDescription: "Must be a valid IAM role ARN"

  MaxSessionDuration:
    Type: Number
    Description: "STS session / Bedrock bearer-token lifetime in seconds (matches the role's max session duration)"
    Default: 43200
    MinValue: 900
    MaxValue: 43200

  # ---------------------------------------------------------------------------
  # Endpoint (private REST API). No certificate, no hosted zone, no DNS record:
  # AWS provides TLS for the execute-api hostname.
  # ---------------------------------------------------------------------------
  VpcEndpointId:
    Type: String
    Description: >
      Existing com.amazonaws.<region>.execute-api interface VPC endpoint to serve
      the API through. Leave EMPTY to have this stack create one, in which case
      VpcId and SubnetIds are required. Supply your own if your organisation
      manages endpoints centrally.
    Default: ""

  VpcId:
    Type: String
    Description: "VPC to create the execute-api endpoint in. Required only when VpcEndpointId is empty."
    Default: ""

  SubnetIds:
    Type: CommaDelimitedList
    Description: >
      Subnets for the execute-api endpoint, ideally one per Availability Zone you
      serve. Required only when VpcEndpointId is empty.
    Default: ""

  EndpointIngressCidr:
    Type: String
    Description: >
      CIDR allowed to reach the created VPC endpoint on 443 — normally the VPC CIDR
      plus, via routing, your VPN clients. Ignored when VpcEndpointId is supplied.
    Default: "10.0.0.0/8"

  StageName:
    Type: String
    Description: "REST API stage name. Appears in the invoke URL path."
    Default: "prod"
    AllowedPattern: "^[a-zA-Z0-9_-]+$"

Conditions:
  # Create the endpoint only when the admin didn't point us at one.
  CreateVpcEndpoint: !Equals [!Ref VpcEndpointId, ""]

Resources:
  BootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-bootstrap"
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 10
      MemorySize: 256
      # Relative dir uploaded to S3 by `aws cloudformation package` at deploy time
      # (the real handler is ~18KB, over the 4KB inline ZipFile limit).
      Code: ./lambda-functions/bootstrap_server/
      Environment:
        Variables:
          # API Gateway REST APIs have no JWT authorizer, so the function does a
          # cheap signature-free pre-check on iss/aud/exp to fail fast. The
          # authoritative validation is STS AssumeRoleWithWebIdentity.
          OIDC_ISSUER: !Ref OidcIssuerUrl
          OIDC_AUDIENCE: !Ref OidcAudience
          DEFAULT_INFERENCE_REGION: !Ref DefaultInferenceRegion
          DEFAULT_INFERENCE_MODELS: !Ref DefaultInferenceModels
          OTLP_ENDPOINT: !Ref OtlpEndpoint
          INFERENCE_SESSION_LIFETIME_SEC: !Ref InferenceSessionLifetimeSec
          DISCOVERY_REGIONS: !Ref DiscoveryRegions
          ZONE_TAG_KEY: !Ref ZoneTagKey
          ROLE_CONFIG: !Ref RoleConfig
          FEATURE_DEFAULTS: !Ref FeatureDefaults
          GROUP_PREFIX: !Ref GroupPrefix
          FEDERATED_ROLE_ARN: !Ref FederatedRoleArn
          MAX_SESSION_DURATION: !Ref MaxSessionDuration
      Role: !GetAtt BootstrapFunctionRole.Arn
      Tags:
        - Key: Application
          Value: "claude-code-with-bedrock"
        - Key: Component
          Value: "bootstrap-server"

  # Least privilege by design. The broker calls STS AssumeRoleWithWebIdentity
  # UNSIGNED (with the user's OIDC token), which is authorized by the target
  # role's trust policy — NOT by this execution role. Do NOT add sts:AssumeRole
  # or bedrock:* grants here; they are unnecessary and would broaden the blast
  # radius. CloudWatch Logs is the only permission required.
  BootstrapFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-bootstrap-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

  # ---------------------------------------------------------------------------
  # execute-api interface VPC endpoint (only when not supplied)
  #
  # Private DNS is deliberately DISABLED. Enabling it would hijack
  # execute-api.<region>.amazonaws.com for the WHOLE VPC, breaking any workload
  # there that calls a public/regional API Gateway. Instead the API is ASSOCIATED
  # with the endpoint, which yields the dedicated hostname
  #   https://{api-id}-{vpce-id}.execute-api.<region>.amazonaws.com/<stage>
  # That form needs no Host or x-apigw-api-id header — which matters, because
  # Claude Desktop cannot send a custom header when fetching its bootstrap config.
  # ---------------------------------------------------------------------------
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateVpcEndpoint
    Properties:
      GroupDescription: !Sub "${AWS::StackName} execute-api endpoint - HTTPS from approved CIDR"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref EndpointIngressCidr
          Description: "HTTPS from approved CIDR"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-execute-api-vpce-sg"
        - Key: Application
          Value: "claude-code-with-bedrock"

  ExecuteApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.execute-api"
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: false

  # ---------------------------------------------------------------------------
  # Private REST API
  # ---------------------------------------------------------------------------
  BootstrapApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      Description: "Claude Desktop Bootstrap Server (private)"
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !If [CreateVpcEndpoint, !Ref ExecuteApiEndpoint, !Ref VpcEndpointId]
      # A PRIVATE API is inaccessible to every VPC until a resource policy grants
      # access. Scope it to the one endpoint so another VPC endpoint in any account
      # cannot invoke it. Enforced at the edge, before the Lambda runs.
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "execute-api:Invoke"
            Resource: "execute-api:/*"
            Condition:
              StringEquals:
                "aws:SourceVpce": !If
                  - CreateVpcEndpoint
                  - !Ref ExecuteApiEndpoint
                  - !Ref VpcEndpointId
          - Effect: Deny
            Principal: "*"
            Action: "execute-api:Invoke"
            Resource: "execute-api:/*"
            Condition:
              StringNotEquals:
                "aws:SourceVpce": !If
                  - CreateVpcEndpoint
                  - !Ref ExecuteApiEndpoint
                  - !Ref VpcEndpointId

  ConfigResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BootstrapApi
      ParentId: !GetAtt BootstrapApi.RootResourceId
      PathPart: "config"

  # ANY so the Lambda also sees OPTIONS and can answer CORS preflight itself.
  # Only /config exists, so every other path is rejected by API Gateway.
  ConfigMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BootstrapApi
      ResourceId: !Ref ConfigResource
      HttpMethod: ANY
      # Authorization is the STS exchange inside the Lambda, plus the resource
      # policy above. See the "where token validation went" note in the header.
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BootstrapFunction.Arn}/invocations"

  BootstrapApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ConfigMethod
    Properties:
      RestApiId: !Ref BootstrapApi

  BootstrapApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref BootstrapApi
      DeploymentId: !Ref BootstrapApiDeployment
      StageName: !Ref StageName

  BootstrapApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BootstrapFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BootstrapApi}/*"

Outputs:
  BootstrapUrl:
    Description: >
      Endpoint for the MDM bootstrapUrl key. Uses the endpoint-associated hostname,
      which works whether or not private DNS is enabled on the VPC endpoint and
      needs no extra request header.
    Value: !Sub
      - "https://${ApiId}-${VpceId}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/config"
      - ApiId: !Ref BootstrapApi
        VpceId: !If [CreateVpcEndpoint, !Ref ExecuteApiEndpoint, !Ref VpcEndpointId]
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapUrl"

  BootstrapUrlPrivateDns:
    Description: >
      Alternative URL, valid ONLY if private DNS is enabled on the execute-api
      endpoint. Enabling it affects the whole VPC, so prefer BootstrapUrl.
    Value: !Sub "https://${BootstrapApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/config"

  BootstrapFunctionArn:
    Description: "Bootstrap Lambda function ARN"
    Value: !GetAtt BootstrapFunction.Arn

  VpcEndpointIdUsed:
    Description: "The execute-api VPC endpoint serving this API — created here, or the one you supplied"
    Value: !If [CreateVpcEndpoint, !Ref ExecuteApiEndpoint, !Ref VpcEndpointId]

  RestApiId:
    Description: "Private REST API ID"
    Value: !Ref BootstrapApi
