# ABOUTME: CloudFormation template for the Claude Desktop Bootstrap Server (credential broker)
# ABOUTME: Deploys an API Gateway HTTP API + Lambda that validates the user's OIDC token,
# ABOUTME: brokers a per-user Bedrock bearer token via AssumeRoleWithWebIdentity, and returns
# ABOUTME: per-user config at sign-in. No end-user binary; pure MDM trust anchor on devices.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Claude Desktop Bootstrap Server — delivers per-user configuration dynamically at
  sign-in as an alternative to static MDM profiles. Validates the user's OIDC token,
  exchanges it for STS credentials (session tags intact), mints a short-term Amazon
  Bedrock bearer token scoped to the user's zone, and returns it with region, models,
  feature toggles, and OTEL settings.

Parameters:
  OidcIssuerUrl:
    Type: String
    Description: "OIDC issuer URL (e.g. https://company.okta.com/oauth2/default)"
    AllowedPattern: "^https://.*"
    ConstraintDescription: "Must be a valid HTTPS URL"

  OidcClientId:
    Type: String
    Description: "OIDC client ID for token audience validation"
    MinLength: 1

  OidcJwksEndpoint:
    Type: String
    Description: "JWKS endpoint URL for JWT signature verification"
    AllowedPattern: "^https://.*"
    ConstraintDescription: "Must be a valid HTTPS URL"

  DefaultInferenceRegion:
    Type: String
    Description: "Default AWS region for Bedrock inference"
    Default: "us-east-1"

  DefaultInferenceModels:
    Type: String
    Description: "Comma-separated list of allowed model IDs"
    Default: "us.anthropic.claude-sonnet-4-20250514-v1:0"

  OtlpEndpoint:
    Type: String
    Description: "OpenTelemetry collector endpoint URL (optional)"
    Default: ""

  InferenceSessionLifetimeSec:
    Type: Number
    Description: "Session lifetime in seconds before re-authentication reminder"
    Default: 28800
    MinValue: 3600
    MaxValue: 86400

  ZoneConfig:
    Type: String
    Description: "JSON mapping of zone names to region config (e.g. {\"usa\":{\"region\":\"us-east-1\",\"sso_region\":\"us-east-1\",\"model_prefix\":\"us\"}})"
    Default: ""

  RoleConfig:
    Type: String
    Description: "JSON mapping of role names to model/MCP config (e.g. {\"consulting\":{\"models\":[\"claude-opus-4-6-v1:0\"],\"max_tokens_per_window\":\"5000000\"}})"
    Default: ""

  FeatureDefaults:
    Type: String
    Description: "JSON of default feature toggles (e.g. {\"chatTabEnabled\":\"true\",\"coworkTabEnabled\":\"true\"})"
    Default: ""

  GroupPrefix:
    Type: String
    Description: "Okta group name prefix for zone/role matching"
    Default: "ccwb-"

  FederatedRoleArn:
    Type: String
    Description: >
      ARN of the existing OIDC-federated IAM role the broker assumes on behalf
      of each user (same role Claude Code uses for direct STS federation). Its
      trust policy already permits sts:AssumeRoleWithWebIdentity + sts:TagSession
      for the org OIDC provider and client-id audience.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$"
    ConstraintDescription: "Must be a valid IAM role ARN"

  MaxSessionDuration:
    Type: Number
    Description: "STS session / Bedrock bearer-token lifetime in seconds (matches the role's max session duration)"
    Default: 43200
    MinValue: 900
    MaxValue: 43200

Resources:
  BootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-bootstrap"
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 10
      MemorySize: 256
      Code:
        ZipFile: |
          # Inline placeholder — real code deployed via package command
          def lambda_handler(event, context):
              return {"statusCode": 500, "body": "Not deployed"}
      Environment:
        Variables:
          OIDC_ISSUER_URL: !Ref OidcIssuerUrl
          OIDC_CLIENT_ID: !Ref OidcClientId
          OIDC_JWKS_ENDPOINT: !Ref OidcJwksEndpoint
          DEFAULT_INFERENCE_REGION: !Ref DefaultInferenceRegion
          DEFAULT_INFERENCE_MODELS: !Ref DefaultInferenceModels
          OTLP_ENDPOINT: !Ref OtlpEndpoint
          INFERENCE_SESSION_LIFETIME_SEC: !Ref InferenceSessionLifetimeSec
          ZONE_CONFIG: !Ref ZoneConfig
          ROLE_CONFIG: !Ref RoleConfig
          FEATURE_DEFAULTS: !Ref FeatureDefaults
          GROUP_PREFIX: !Ref GroupPrefix
          FEDERATED_ROLE_ARN: !Ref FederatedRoleArn
          MAX_SESSION_DURATION: !Ref MaxSessionDuration
      Role: !GetAtt BootstrapFunctionRole.Arn
      Tags:
        - Key: Application
          Value: "claude-code-with-bedrock"
        - Key: Component
          Value: "bootstrap-server"

  # Least privilege by design. The broker calls STS AssumeRoleWithWebIdentity
  # UNSIGNED (with the user's OIDC token), which is authorized by the target
  # role's trust policy — NOT by this execution role. Do NOT add sts:AssumeRole
  # or bedrock:* grants here; they are unnecessary and would broaden the blast
  # radius. CloudWatch Logs is the only permission required.
  BootstrapFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-bootstrap-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

  BootstrapApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      Description: "CoWork Bootstrap Server API"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 3600

  BootstrapApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BootstrapApi
      StageName: "$default"
      AutoDeploy: true

  BootstrapApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BootstrapApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BootstrapFunction.Arn
      PayloadFormatVersion: "2.0"

  BootstrapApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BootstrapApi
      RouteKey: "GET /config"
      Target: !Sub "integrations/${BootstrapApiIntegration}"

  BootstrapApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BootstrapFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BootstrapApi}/*"

Outputs:
  BootstrapUrl:
    Description: "Bootstrap server endpoint URL for MDM bootstrapUrl key"
    Value: !Sub "https://${BootstrapApi}.execute-api.${AWS::Region}.amazonaws.com/config"
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapUrl"

  BootstrapFunctionArn:
    Description: "Bootstrap Lambda function ARN"
    Value: !GetAtt BootstrapFunction.Arn

  BootstrapApiId:
    Description: "API Gateway HTTP API ID"
    Value: !Ref BootstrapApi
