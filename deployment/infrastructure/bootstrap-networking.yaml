# ABOUTME: Optional VPC for the Claude Desktop Bootstrap Server load balancer
# ABOUTME: Shape follows AlbScheme: internal => 2 private subnets with NO route off the
# ABOUTME: VPC at all; internet-facing => 2 public subnets + an internet gateway.
# ABOUTME: Deployed before bootstrap-server.yaml, which reads VpcId/SubnetIds from here.

# WHY THIS IS A SEPARATE, OPTIONAL STACK
#   Most customers already have a VPC and supply its ID. This exists only for the
#   "create a new VPC" path in `ccwb init`, and mirrors how networking.yaml is
#   deployed ahead of the monitoring stack.
#
# WHY THERE IS NO NAT GATEWAY
#   Nothing here needs outbound access. The load balancer only receives traffic,
#   and the bootstrap Lambda runs OUTSIDE the VPC (an ALB invokes a Lambda target
#   through the Lambda API, not through an ENI in these subnets). A NAT gateway
#   would have nothing routed through it while costing ~$32/month per AZ, so it is
#   deliberately omitted. Add one only if you later place workloads that need
#   egress in this VPC.
#
# WHAT "INTERNAL" MEANS HERE
#   With AlbScheme=internal this VPC gets no internet gateway, no NAT and no route
#   to anything outside itself. That is the strongest form of the private
#   requirement -- and it also means NOTHING can reach the endpoint until you
#   attach connectivity yourself (VPN, Direct Connect, peering, Transit Gateway)
#   or place clients inside the VPC. This stack does not provision any of that.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Optional VPC for the Claude Desktop Bootstrap Server load balancer. With
  AlbScheme=internal it creates two private subnets across two Availability Zones
  and no path off the VPC. With AlbScheme=internet-facing it creates two public
  subnets and an internet gateway. No NAT gateway in either case.

Parameters:
  AlbScheme:
    Type: String
    Description: >
      Must match the AlbScheme passed to bootstrap-server.yaml. internal builds a
      fully private VPC; internet-facing adds an internet gateway.
    Default: internal
    AllowedValues:
      - internal
      - internet-facing

  VpcCidr:
    Type: String
    Description: >
      CIDR for the new VPC. Must be a /16 -- the two subnets are carved from it as
      /24s. Pick a range that does not overlap anything you may later peer with.
    Default: "10.60.0.0/16"
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/16$"
    ConstraintDescription: "Must be a valid IPv4 CIDR with a /16 prefix, e.g. 10.60.0.0/16"

Conditions:
  IsPublic: !Equals [!Ref AlbScheme, "internet-facing"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      # Needed so a private Route 53 hosted zone associated with this VPC resolves.
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"
        - Key: Application
          Value: "claude-code-with-bedrock"
        - Key: Component
          Value: "bootstrap-server"

  # Two subnets in two AZs -- an Application Load Balancer requires at least two.
  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-subnet-1"
        - Key: Application
          Value: "claude-code-with-bedrock"

  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-subnet-2"
        - Key: Application
          Value: "claude-code-with-bedrock"

  # One route table either way. For internal it holds only the implicit local
  # route, so there is no path out of the VPC.
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !If
            - IsPublic
            - !Sub "${AWS::StackName}-public-rt"
            - !Sub "${AWS::StackName}-private-rt"

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref RouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref RouteTable

  # --- internet-facing only ---
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: IsPublic
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: IsPublic
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    Condition: IsPublic
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

Outputs:
  VpcId:
    Description: "VPC for the bootstrap load balancer"
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  SubnetIds:
    Description: "Comma-separated subnet IDs for the load balancer (2 AZs)"
    Value: !Join [",", [!Ref Subnet1, !Ref Subnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-SubnetIds"

  VpcCidr:
    Description: "VPC CIDR — used as the default load-balancer ingress CIDR"
    Value: !Ref VpcCidr

  SubnetKind:
    Description: "Whether the created subnets are private or public"
    Value: !If [IsPublic, "public", "private"]

  Reachability:
    Description: "Reminder about how clients reach this VPC"
    Value: !If
      - IsPublic
      - "Public subnets with an internet gateway; the load balancer is internet-facing."
      - "Fully private: no internet gateway, no NAT, no route off the VPC. Attach VPN/Direct Connect/peering or place clients inside the VPC."
